[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "split-membership-check"
version = "0.1.0"
description = "Offline checker for explicit normalized synthetic dataset split assignments"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
split-membership-check = "split_membership_check.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
